services:
  stage4:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: stage_4_layer_1
    working_dir: /workspace
    volumes:
      - ..:/workspace
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8888:8888"
    stdin_open: true
    tty: true
    command: >
      bash -lc "jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root"

volumes:
  hf_cache: